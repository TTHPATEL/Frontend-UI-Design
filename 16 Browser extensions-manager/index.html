<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Browser extensions manager UI</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 11px;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <main>
      <div id="extension"></div>
    </main>

    <script>
      fetch("data.json")
        .then((res) => res.json())
        .then((data) => {
          const extension = document.getElementById("extension");
          data.forEach((ext) => {
            const card = document.createElement("div");
            card.classList.add("card");
            card.innerHTML = `<img src="${ext.logo}" alt="${ext.name} logo" />
            <h3>${ext.name}</h3>
            <p>${ext.description}</p>
            <button>Remove</button>
           <button class="${ext.isActive ? "" : "inactive"}">
                ${ext.isActive ? "Active" : "Inactive"}
              </button>`;

            // const extensionInfo = document.createElement("p");
            // extensionInfo.textContent = `${ext.name}, Description: ${ext.description}, City: ${ext.isActive}`;
            extension.appendChild(card);
          });
        })
        .catch((err) => console.error("Error loading JSON:", err));
    </script>
    <!-- Extensions List All Active Inactive -->
