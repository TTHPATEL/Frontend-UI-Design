<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeetMetric</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>LeetMetric - Stats</h1>
      <!-- USER CONTAINER -->
      <div class="user_container">
        <p>Enter your leetcode username below :</p>
        <div class="user_input_container">
          <input
            type="text"
            placeholder="Enter your username here"
            id="user_input"
          />
          <button id="search_btn">Search</button>
        </div>
      </div>
      <!-- STATS CONTAINER -->
      <div class="stats_container hide">
        <div class="progress">
          <!-- PROGRESS ITEM 1 -->
          <div class="progress_item">
            <div class="easy_progress circle">
              <span id="easy_label"></span>
              <p>Easy</p>
            </div>
          </div>

          <!-- PROGRESS ITEM 2 -->
          <div class="progress_item">
            <div class="medium_progress circle">
              <span id="medium_label"></span>
              <p>Medium</p>
            </div>
          </div>

          <!-- PROGRESS ITEM 3 -->
          <div class="progress_item">
            <div class="hard_progress circle">
              <span id="hard_label"></span>
              <p>Hard</p>
            </div>
          </div>
        </div>
        <div class="stats_card">
          <!-- Directly populate card here from the JS Code -->
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
