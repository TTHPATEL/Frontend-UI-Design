<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Slider</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
      }

      .slider {
        position: relative;
        width: 100%;
        height: 80vh;
        overflow: hidden;
      }

      .slides {
        display: flex;
        width: 500%; /* 5 slides → 100% * 5 */
        height: 100%;
        transition: transform 0.6s ease-in-out;
      }

      .slide {
        width: 100%;
        flex-shrink: 0;
      }

      .slide img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* Radio controls */
      .navigation {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
      }

      .bar {
        width: 12px;
        height: 12px;
        border: 2px solid white;
        border-radius: 50%;
        cursor: pointer;
        background: transparent;
        transition: 0.3s;
      }

      .bar.active {
        background: white;
      }
    </style>
  </head>
  <body>
    <div class="slider">
      <div class="slides">
        <div class="slide">
          <img src="https://picsum.photos/id/1015/1600/800" alt="Image 1" />
        </div>
        <div class="slide">
          <img src="https://picsum.photos/id/1016/1600/800" alt="Image 2" />
        </div>
        <div class="slide">
          <img src="https://picsum.photos/id/1018/1600/800" alt="Image 3" />
        </div>
        <div class="slide">
          <img src="https://picsum.photos/id/1020/1600/800" alt="Image 4" />
        </div>
        <div class="slide">
          <img src="https://picsum.photos/id/1024/1600/800" alt="Image 5" />
        </div>
      </div>

      <!-- Navigation -->
      <div class="navigation">
        <div class="bar active" data-index="0"></div>
        <div class="bar" data-index="1"></div>
        <div class="bar" data-index="2"></div>
        <div class="bar" data-index="3"></div>
        <div class="bar" data-index="4"></div>
      </div>
    </div>

    <script>
      const slides = document.querySelector(".slides");
      const bars = document.querySelectorAll(".bar");
      let index = 0;
      const totalSlides = bars.length;

      function showSlide(i) {
        index = i;
        slides.style.transform = `translateX(${-index * 100}%)`;
        bars.forEach((bar) => bar.classList.remove("active"));
        bars[index].classList.add("active");
      }

      // Auto slide
      function autoSlide() {
        index = (index + 1) % totalSlides;
        showSlide(index);
      }

      let slideInterval = setInterval(autoSlide, 4000);

      // Manual click on indicators
      bars.forEach((bar) => {
        bar.addEventListener("click", () => {
          clearInterval(slideInterval);
          showSlide(parseInt(bar.dataset.index));
          slideInterval = setInterval(autoSlide, 4000);
        });
      });
    </script>
  </body>
</html>
